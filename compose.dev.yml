name: novasms-frontend-dev

services:
  web:
    build:
      context: ./sms-frontend
      dockerfile: Dockerfile.dev
    image: novasms-frontend-dev:local
    restart: "no"
    init: true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:4010
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./sms-frontend:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s

volumes:
  node_modules:

